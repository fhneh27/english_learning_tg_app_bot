name: CI

on:
  push:
    branches: [test/deploy-check]
  pull_request:
    branches: [test/deploy-check]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_vocabulary
          POSTGRES_HOST: localhost
          DB_PORT: "5432"
          HOST_DB_PORT: "5432"
          TG_BOT_TOKEN: "123456789:ci-test-token"
          BACKEND_HOST: 0.0.0.0
          BACKEND_PORT: "8000"
          BACKEND_RELOAD: "false"
          API_V1_PREFIX: /api/v1
          FRONTEND_PORT: "5173"
          WEBAPP_URL: http://localhost:5173
          VITE_API_URL: /api/v1
          OPENAI_API_KEY: sk-ci-test-key
          OPENAI_MODEL: gpt-4o-mini
          OPENAI_TIMEOUT_SECONDS: "30"
          APP_ENV: development
          LOG_LEVEL: INFO
          DEFAULT_UI_LANGUAGE: ru
          DEFAULT_LEARNING_LANGUAGE: en
          DEFAULT_TRANSLATION_LANGUAGE: ru
          CORS_ORIGINS: http://localhost:5173
          ALLOW_DEV_AUTH_BYPASS: "true"
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
